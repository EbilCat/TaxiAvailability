[project]
name = "taxiavailability"
version = "0.1.0"
description = "Report Singapore's areas with the most available taxis from the data.gov.sg Taxi Availability API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are self-documenting via descriptive names; exempt from docstring rules.
"tests/*" = ["D"]
